# Ontwikkelomgeving: werkcontainer plus de database en de model registry.
# Alleen voor lokaal ontwikkelen; wachtwoorden hier zijn geen geheimen.
name: ses-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://ses:ses@db:5432/ses
      PGHOST: db
      PGUSER: ses
      PGPASSWORD: ses
      PGDATABASE: ses
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ALEMBIC_CONFIG: database/alembic.ini   # zodat alembic zonder -c werkt vanuit de root van de repo
      # Wachtwoorden van de inlogrollen, gezet door migratie 0001 (alleen lokaal)
      SES_PASSWORD_DBA: user
      SES_PASSWORD_FRONTEND: user
      SES_PASSWORD_BACKEND: user
      SES_PASSWORD_BACKUP: user
      # Service tokens voor de Backend API (alleen lokaal)
      BACKEND_API_URL: http://backend-api:8001/v1
      SES_TOKEN_PROCESSING: dev-processing
      SES_TOKEN_TRAINING: dev-training
      SES_TOKEN_FORECAST: dev-forecast
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started

  db:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ses
      POSTGRES_PASSWORD: ses
      POSTGRES_DB: ses
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ses -d ses"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ../services/backend-api
    restart: unless-stopped
    # --reload: bij elke wijziging in src/ start de API opnieuw
    command: uvicorn backend_api.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/src
    volumes:
      - ../services/backend-api/src:/app/src
    environment:
      BACKEND_DATABASE_URL: postgresql://ses_backend:user@db:5432/ses
      SES_TOKEN_PROCESSING: dev-processing
      SES_TOKEN_TRAINING: dev-training
      SES_TOKEN_FORECAST: dev-forecast
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:*,localhost,localhost:*,127.0.0.1:*
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  db-data:
  mlflow-data:
