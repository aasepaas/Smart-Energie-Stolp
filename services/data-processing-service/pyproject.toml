[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-processing-service"
version = "0.1.0"
description = "SES Data processing service: meterdata importeren en valideren"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ses-import = "data_processing_service.__main__:main"

# hatchling maakt bij pip install -e geen .egg-info-map aan in src/
[tool.hatch.build.targets.wheel]
packages = ["src/data_processing_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
